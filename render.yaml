services:
  - type: web
    name: visionpro
    runtime: docker
    plan: free              # 512 MB RAM is tight for YOLO; use "starter" if the service restarts (out of memory)
    healthCheckPath: /_stcore/health
    envVars:
      - key: ADMIN_USERNAME
        sync: false         # you type these in the Render dashboard, never in Git
      - key: ADMIN_PASSWORD
        sync: false
      - key: PROCESS_WIDTH
        value: "640"
      - key: YOLO_IMGSZ
        value: "480"
      - key: ALLOWED_MODELS
        value: "yolo11n.pt,yolo11s.pt"
      - key: PERSISTENT_STORAGE
        value: "false"

services:
  visionpro:
    build: .
    ports: ["5000:5000"]
    environment:
      SECRET_KEY: change-me-to-a-long-random-string
      ADMIN_USER: ritesh
      ADMIN_PASS: vision@123
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./snapshots:/app/snapshots
      - ./videos:/app/videos        # put demo videos here, then use source: videos/demo.mp4
    # Linux webcam: uncomment the next two lines, then use source 0
    # devices: ["/dev/video0:/dev/video0"]
    restart: unless-stopped

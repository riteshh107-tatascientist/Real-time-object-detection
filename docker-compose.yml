services:
  visionpro:
    build: .
    ports:
      - "5000:10000"
    env_file:
      - .env
    environment:
      PORT: 10000
      DB_PATH: /app/data/visionpro.db
      VIDEO_DIR: /app/videos
      SNAPSHOT_DIR: /app/snapshots
      RECORDING_DIR: /app/recordings
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./snapshots:/app/snapshots
      - ./videos:/app/videos
    restart: unless-stopped
